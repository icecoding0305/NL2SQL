# 模型配置
runtime:
  # 单一模型配置源：主流程、节点任务与 SQL 生成兜底共用同一个模型。
  # 后续切换模型只需修改本段；密钥只保存于环境变量，不得直接写入本文件。
  unified: true
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  # DeepSeek 当前走纯 JSON 文本解析；切换支持 function calling 的 OpenAI 兼容模型时可设 true。
  supports_tool_calling: false

embedding:
  # local:本地 sentence-transformers(需可下载/离线缓存模型)
  # fake:测试用确定性词袋向量(不依赖模型,仅测试)
  provider: local
  model: paraphrase-multilingual-MiniLM-L12-v2
  # 本地已下载的模型目录(相对项目根解析);不配则按 model 名从 huggingface 下载
  model_path: models/models/sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2/snapshots/master
  dimension: 384
  # 同一查询会检索表/字段/关系三个集合，复用其单条查询向量。
  query_cache_size: 256
  # 该模型为默认基线。更换中文金融领域模型前，应使用真实标注集对比
  # Recall@K、字段召回率、Join 路径正确率和澄清率，并同步修改 dimension。

# 各节点模型(离线/专用任务可用更便宜模型)
nodes:
  query_resolution:
    inherit: runtime
  plan_generation:
    inherit: runtime
  schema_comment_generation:
    inherit: runtime
