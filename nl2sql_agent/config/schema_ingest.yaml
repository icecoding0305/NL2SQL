# 表结构入库配置(schema_ingest)
quality_check:
  # 表注释少于该字数视为"空"
  min_table_comment_length: 4
  # 字段注释覆盖率低于该比例 → 整张表打回待审核
  min_column_comment_coverage: 0.8
  # 覆盖率达标仍不能放过剩余空字段；每列都必须有最低质量描述
  require_all_columns: true
  min_column_comment_length: 2
  generic_comments: [字段, 数据, 相关字段, 业务字段, 暂无]

# XiYan 思路的轻量字段画像:每张变化表只执行一次受限采样，不跑全表 COUNT DISTINCT
profiling:
  enabled: true
  sample_size: 100
  example_limit: 3
  # 宽表只选择最有业务价值的字段执行一次受限查询
  max_columns_per_query: 20
  # skip 表示敏感列不进入 SELECT，避免“查询后再脱敏”仍接触原始值
  sensitive_mode: skip
  exclude_types: [blob, tinyblob, mediumblob, longblob, binary, varbinary, longtext, mediumtext, json, geometry]
  exclude_name_patterns: [password, passwd, pwd, secret, token, private_key, access_key]

# 注释生成复用字段画像，不再为缺注释的表重复读取一遍数据
comment_generation:
  use_profile_samples: true

# 规则优先分类，低基数维度识别为 enum；不对每一列单独调用 LLM
classification:
  enum_max_distinct: 20

# 无外键数据库的保守关系发现；结果只进入候选库，不会直接参与 SQL JOIN
relation_discovery:
  enabled: true
  # 注释修正后由关系管理页面主动触发，避免 Schema 导入阶段过早产生候选。
  run_on_schema_sync: false
  min_confidence: 0.68
  inferred_confidence: 0.84
  max_candidates: 200
  # 无 PK/UK 的数仓表允许使用字段画像推断中心实体；仍只生成待确认候选。
  allow_profile_inference: true
  warehouse_anchor_threshold: 0.62
  # 同一业务标识只连接到一个中心锚点，限制星型边数量，禁止两两组合。
  max_edges_per_identifier: 25

# M-Schema 输出；相对路径从项目根目录解析
artifact_dir: data/schema
prompt_version: enterprise-xiyan-v1

# 字段级 embedding 文本分组(几十上百个字段拼一条会损失检索精度)
columns_per_chunk: 1

# 敏感字段标注关键字(列名/注释命中即标 sensitive,取值需脱敏)
sensitive_patterns:
  - "身份证"
  - "证件号"
  - "证件号码"
  - "证件"
  - "手机"
  - "电话"
  - "mobile"
  - "idnum"
  - "idcard"

# 脱敏样例值取样数
sample_limit: 3
