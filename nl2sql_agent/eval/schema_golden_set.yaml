    tags: [贷款, 应还, 两表]
    question: 查询贷款金额及每一期应还本金
    data_scope: [risk_mart]
    query_intent: {query_type: multi_fact, entities: [{text: 贷款, role: entity}, {text: 还款计划, role: entity}], measures: [{text: 贷款金额, role: measure}, {text: 应还本金, role: measure}], dimensions: [{text: 当前期数, role: dimension}]}
