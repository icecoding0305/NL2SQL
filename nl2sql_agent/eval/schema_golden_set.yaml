version: 2
description: 生产 Schema Grounding 黄金集；所有物理对象来自 risk_mart effective M-Schema，query_intent 为人工冻结输入。
m_schema_path: ../../data/schema/risk_mart/m-schema.json
coverage:
  case_count: 24
  suites: {governed_metric: 5, entity_attribute: 4, event_disambiguation: 5, time_and_filter: 3, multi_table_join: 5, clarification: 2}
  schema_tables: [dwd_ar_loan_info, dwd_ev_indv_crd_app, dwd_ev_repay_detail, dwd_ev_repay_plan, dwd_ip_indv_cust_info, dwd_sr_claim_detail]

cases:
  - id: metric_loan_amount_colloquial
    suite: governed_metric
    tags: [贷款, 口语, 时间, 聚合]
    question: 上个月放了多少款
    data_scope: [risk_mart]
    query_intent: {query_type: aggregation, measures: [{text: 贷款金额, role: measure}], filters: [{text: 放款时间, role: time, operator: last_month}]}
    expected_tables: [dwd_ar_loan_info]
    expected_columns: [dwd_ar_loan_info.LOAN_AMT]
    forbidden_tables: [dwd_ev_repay_plan, dwd_ev_repay_detail, dwd_sr_claim_detail]
    expected_plan_tables: [dwd_ar_loan_info]
    expected_clarification: false

  - id: metric_overdue_principal
    suite: governed_metric
    tags: [贷款, 逾期, 平台过滤]
    question: 新信贷的逾期本金余额是多少
    data_scope: [risk_mart]
    query_intent: {query_type: aggregation, measures: [{text: 逾期本金, role: measure}], filters: [{text: 平台, role: status, operator: '=', value: 新信贷}]}
    expected_tables: [dwd_ar_loan_info]
    expected_columns: [dwd_ar_loan_info.OVD_BAL, dwd_ar_loan_info.PLATFORM_CODE]
    forbidden_tables: [dwd_ev_repay_detail, dwd_sr_claim_detail]
    expected_plan_tables: [dwd_ar_loan_info]
    expected_clarification: false

  - id: metric_loan_balance
    suite: governed_metric
    tags: [贷款, 余额, 聚合]
    question: 当前贷款本金余额合计
    data_scope: [risk_mart]
    query_intent: {query_type: aggregation, measures: [{text: 贷款余额, role: measure}]}
    expected_tables: [dwd_ar_loan_info]
    expected_columns: [dwd_ar_loan_info.PRIN_BAL]
    forbidden_tables: [dwd_ev_repay_plan]
    expected_plan_tables: [dwd_ar_loan_info]
    expected_clarification: false

  - id: metric_normal_principal_by_product
    suite: governed_metric
    tags: [贷款, 正常本金, 分组]
    question: 按产品统计正常本金
    data_scope: [risk_mart]
    query_intent: {query_type: aggregation, measures: [{text: 正常本金, role: measure}], dimensions: [{text: 产品, role: dimension}]}
    expected_tables: [dwd_ar_loan_info]
    expected_columns: [dwd_ar_loan_info.NORMAL_BAL, dwd_ar_loan_info.PRD_CODE]
    expected_plan_tables: [dwd_ar_loan_info]
    expected_clarification: false

  - id: metric_claim_total
    suite: governed_metric
    tags: [代偿, 产品, 聚合]
    question: 按产品汇总代偿总额
    data_scope: [risk_mart]
    query_intent: {query_type: aggregation, measures: [{text: 代偿金额, role: measure}], dimensions: [{text: 产品, role: dimension}]}
    expected_tables: [dwd_sr_claim_detail]
    expected_columns: [dwd_sr_claim_detail.DC_ALL_BAL, dwd_sr_claim_detail.PRD_CODE]
    forbidden_tables: [dwd_ar_loan_info, dwd_ev_repay_detail]
    expected_plan_tables: [dwd_sr_claim_detail]
    expected_clarification: false

  - id: entity_customer_schooling
    suite: entity_attribute
    tags: [客户, 学历, 当前属性, 同名字段]
    question: 学历为本科的客户
    data_scope: [risk_mart]
    query_intent: {query_type: fact_filter, entities: [{text: 客户, role: entity}], attributes: [{text: 客户姓名, role: attribute}], filters: [{text: 最高学历, role: status, operator: '=', value: 本科}]}
    expected_tables: [dwd_ip_indv_cust_info]
    expected_columns: [dwd_ip_indv_cust_info.HIGHEST_SCHOOLING, dwd_ip_indv_cust_info.NAME]
    forbidden_tables: [dwd_ev_indv_crd_app]
    expected_plan_tables: [dwd_ip_indv_cust_info]
    expected_clarification: false

  - id: entity_customer_profile
    suite: entity_attribute
    tags: [客户, 基本信息, 多字段]
    question: 查询客户的姓名、年龄、婚姻状况和居住地址
    data_scope: [risk_mart]
    query_intent:
      query_type: attribute_lookup
      entities: [{text: 客户, role: entity}]
      attributes: [{text: 姓名, role: attribute}, {text: 年龄, role: attribute}, {text: 婚姻状况, role: attribute}, {text: 居住地址, role: attribute}]
    expected_tables: [dwd_ip_indv_cust_info]
    expected_columns: [dwd_ip_indv_cust_info.NAME, dwd_ip_indv_cust_info.AGE, dwd_ip_indv_cust_info.MARRIAGE, dwd_ip_indv_cust_info.RESIADDR]
    forbidden_tables: [dwd_ev_indv_crd_app]
    expected_plan_tables: [dwd_ip_indv_cust_info]
    expected_clarification: false

