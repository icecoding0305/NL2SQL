    forbidden_tables: [dwd_ev_repay_detail]
    expected_plan_tables: [dwd_ar_loan_info, dwd_ev_repay_plan]
    expected_clarification: false

  - id: join_plan_actual_comparison
    suite: multi_table_join
    tags: [应还, 实还, 复合键, 对比]
    question: 对比每笔借据每一期的应还本金和实还本金
    data_scope: [risk_mart]
    query_intent: {query_type: multi_fact, entities: [{text: 还款计划, role: entity}, {text: 实际还款明细, role: entity}], measures: [{text: 应还本金, role: measure}, {text: 实还本金, role: measure}], dimensions: [{text: 借据编号, role: dimension}, {text: 当前期数, role: dimension}]}
    expected_tables: [dwd_ev_repay_plan, dwd_ev_repay_detail]
    expected_columns: [dwd_ev_repay_plan.RPY_PRINC, dwd_ev_repay_detail.PRINC, dwd_ev_repay_plan.LOAN_NO, dwd_ev_repay_plan.TERM_NO]
    expected_joins: [[dwd_ev_repay_plan.LOAN_NO, dwd_ev_repay_detail.LOAN_NO], [dwd_ev_repay_plan.TERM_NO, dwd_ev_repay_detail.TERM_NO]]
    expected_plan_tables: [dwd_ev_repay_plan, dwd_ev_repay_detail]
    expected_clarification: false

