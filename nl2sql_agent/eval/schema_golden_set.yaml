  - id: join_overdue_customer
    suite: multi_table_join
    tags: [贷款, 客户, 两表, 聚合]
    question: 查询有逾期本金的客户最高学历和逾期本金
    data_scope: [risk_mart]
    query_intent: {query_type: multi_fact, entities: [{text: 客户, role: entity}], measures: [{text: 逾期本金, role: measure}], attributes: [{text: 最高学历, role: attribute}], filters: [{text: 逾期本金, role: status, operator: '>', value: 0}]}
    expected_tables: [dwd_ar_loan_info, dwd_ip_indv_cust_info]
    expected_columns: [dwd_ar_loan_info.OVD_BAL, dwd_ip_indv_cust_info.HIGHEST_SCHOOLING]
